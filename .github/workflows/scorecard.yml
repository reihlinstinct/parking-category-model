name: OpenSSF Scorecard
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 0'
permissions:
  contents: read
jobs:
  guard:
    name: Scorecard regression guard
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Offline guard and self-tests
        run: |
          python3 -m unittest discover -s tests/security -p test_scorecard_guard.py -v
          python3 scripts/security/scorecard_guard.py
  analysis:
    if: github.event_name != 'pull_request'
    needs: guard
    name: Scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Scorecard regression guard and self-tests
        run: |
          python3 -m unittest discover -s tests/security -p test_scorecard_guard.py -v
          python3 scripts/security/scorecard_guard.py
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: results.sarif
