name: Vulnerability scan

on:
  pull_request:
  schedule:
    - cron: '52 5 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  scan-pr:
    if: github.event_name != 'schedule'
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    uses: reihlinstinct/dependency-inventory/.github/workflows/scan-reusable.yml@48a94064738218cc35d94f5909f08bf82c43ad8d # v1.0.4
  scan-weekly:
    if: github.event_name == 'schedule'
    permissions:
      actions: read
      contents: write
      pull-requests: read
      security-events: write
    uses: reihlinstinct/dependency-inventory/.github/workflows/scan-reusable.yml@48a94064738218cc35d94f5909f08bf82c43ad8d # v1.0.4
    with:
      commit-inventory: true
