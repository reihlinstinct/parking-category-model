name: Vulnerability scan

on:
  pull_request:
  schedule:
    - cron: '52 5 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  scan-pr:
    if: github.event_name != 'schedule'
    permissions:
      contents: read
      pull-requests: read
    uses: reihlinstinct/dependency-inventory/.github/workflows/scan-reusable.yml@8cd2c62b15aeab91eb8a4ef11bd931c4a791111d # v1.0.6
  scan-weekly:
    if: github.event_name == 'schedule'
    permissions:
      contents: read
    uses: reihlinstinct/dependency-inventory/.github/workflows/scan-reusable.yml@8cd2c62b15aeab91eb8a4ef11bd931c4a791111d # v1.0.6
