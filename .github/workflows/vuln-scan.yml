name: Vulnerability scan

on:
  pull_request:
  schedule:
    - cron: '52 5 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  scan-pr:
    if: github.event_name != 'schedule'
    permissions:
      contents: read
      pull-requests: read
    uses: reihlinstinct/dependency-inventory/.github/workflows/scan-reusable.yml@b5a520395f9099e460615a25c791f90b71d9bd49 # v1.0.7
  scan-weekly:
    if: github.event_name == 'schedule'
    permissions:
      contents: read
    uses: reihlinstinct/dependency-inventory/.github/workflows/scan-reusable.yml@b5a520395f9099e460615a25c791f90b71d9bd49 # v1.0.7
