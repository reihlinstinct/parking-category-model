name: Vulnerability scan

on:
  pull_request:
  schedule:
    - cron: '52 5 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  scan-pr:
    if: github.event_name != 'schedule'
    permissions:
      contents: read
      pull-requests: read
    uses: reihlinstinct/dependency-inventory/.github/workflows/scan-reusable.yml@8fa468e0fd2728a26d484611a4f21d42e9ad85aa # v1.0.5
  scan-weekly:
    if: github.event_name == 'schedule'
    permissions:
      contents: write
      pull-requests: read
    uses: reihlinstinct/dependency-inventory/.github/workflows/scan-reusable.yml@8fa468e0fd2728a26d484611a4f21d42e9ad85aa # v1.0.5
    with:
      commit-inventory: true
