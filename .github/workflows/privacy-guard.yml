name: Privacy guard

on:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  privacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: reihlinstinct/repo-checks/actions/privacy@5d4442070254cdc98f36a1cdbe8137b8cb014d30 # v1.0.0
        with:
          checkout-root: ${{ github.workspace }}
